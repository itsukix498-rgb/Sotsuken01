[client]
# 右上メニューを最小限にし、閲覧者に「Deploy」などの開発者向けボタンを出さない
toolbarMode = "minimal"

[browser]
# 利用状況の送信をしない
gatherUsageStats = false

[server]
# アップロードできるPDFの最大サイズ（MB）
maxUploadSize = 50

[theme]
# 大学のサイトのような、清潔感のある青緑を基調にする（ボタン・選択中の項目など）
base = "light"
primaryColor = "#1486AD"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF7FB"
textColor = "#222222"
linkColor = "#1486AD"
borderColor = "#D3E5EC"
# 角の丸みを小さくし、四角に近い落ち着いた形にする
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
# 文字は Noto Sans JP。見出しの英字は Montserrat（日本語の文字は Noto Sans JP で表示される）
# （URLの後ろに代わりのフォントを続けると、URLの一部として読まれてしまうので、代わりのフォントは ui_common.py のCSSで指定する）
font = "Noto Sans JP:https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
headingFont = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
