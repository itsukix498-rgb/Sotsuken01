[client]
# 右上メニューを最小限にし、閲覧者に「Deploy」などの開発者向けボタンを出さない
toolbarMode = "minimal"

[browser]
# 利用状況の送信をしない
gatherUsageStats = false

[server]
# アップロードできるPDFの最大サイズ（MB）
maxUploadSize = 50

[theme]
# 落ち着いた深緑を基調にする（ボタン・選択中の項目など）
base = "light"
primaryColor = "#2E5E4E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F3"
textColor = "#1F2A27"
